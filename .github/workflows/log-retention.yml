name: Log retention tests

on:
  push:
    branches: ['feature/log-retention']
    paths:
      - 'app/Lib/Tools/LogRetention*.php'
      - 'app/Test/LogRetention*Test.php'
      - '.github/workflows/log-retention.yml'
  pull_request:
    branches: ['2.5']
    paths:
      - 'app/Lib/Tools/LogRetention*.php'
      - 'app/Test/LogRetention*Test.php'
      - '.github/workflows/log-retention.yml'

permissions:
  contents: read

jobs:
  retention:
    name: Retention (PHP ${{ matrix.php }}, MariaDB 10.11)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: retention-root
          MARIADB_DATABASE: retention_test
          MARIADB_USER: retention
          MARIADB_PASSWORD: retention-test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP and PHPUnit
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, xml
          tools: phpunit:8.5
          coverage: none
      - name: Lint retention implementation and tests
        run: find app/Lib/Tools app/Test -maxdepth 1 -name 'LogRetention*.php' -print0 | xargs -0 -n1 php -l
      - name: Run retention unit and database tests
        env:
          MISP_RETENTION_TEST_DSN: mysql:host=127.0.0.1;port=${{ job.services.mariadb.ports[3306] }};dbname=retention_test
          MISP_RETENTION_TEST_USER: retention
          MISP_RETENTION_TEST_PASSWORD: retention-test
        run: |
          for test in app/Test/LogRetention*Test.php; do
            phpunit "$test" || exit 1
          done
